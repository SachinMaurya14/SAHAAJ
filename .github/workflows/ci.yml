name: SAAHAJ Continuous Integration (CI)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Run ESLint & Typecheck
      run: npm run lint

    - name: Run System Tests & Medical Integrity Suites
      run: npx tsx server/tests/v10_system_test.ts
      env:
        NODE_ENV: test
        GEMINI_API_KEY: ""

    - name: Compile and Bundle Check
      run: npm run build
