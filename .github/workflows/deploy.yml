name: SAAHAJ Continuous Deployment (CD)

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]

jobs:
  deploy-cloud-run:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || vars.GCP_PROJECT_ID }}
      GCP_REGION: asia-southeast1
      SERVICE_NAME: saahaj-production
      IMAGE_TAG: gcr.io/${{ secrets.GCP_PROJECT_ID || vars.GCP_PROJECT_ID }}/saahaj:${{ github.sha }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Validate GCP Configuration
      run: |
        if [ -z "$GCP_PROJECT_ID" ]; then
          echo "::error::GCP_PROJECT_ID is empty! Please configure GCP_PROJECT_ID in GitHub Repository Secrets (secrets.GCP_PROJECT_ID) or Variables (vars.GCP_PROJECT_ID)."
          exit 1
        fi
        echo "Using GCP Project: $GCP_PROJECT_ID"
        echo "Target Image: $IMAGE_TAG"

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY || secrets.GOOGLE_CREDENTIALS || secrets.GCP_CREDENTIALS }}
        project_id: ${{ env.GCP_PROJECT_ID }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ env.GCP_PROJECT_ID }}

    - name: Configure Docker for GCP Registry
      run: |
        gcloud auth configure-docker gcr.io --quiet

    - name: Build Docker Image
      run: |
        docker build -t "$IMAGE_TAG" .

    - name: Push Docker Image
      run: |
        docker push "$IMAGE_TAG"

    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy "$SERVICE_NAME" \
          --image "$IMAGE_TAG" \
          --platform managed \
          --region "$GCP_REGION" \
          --project "$GCP_PROJECT_ID" \
          --allow-unauthenticated \
          --port 3000
